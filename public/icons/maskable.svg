<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lunara">
  <title>Lunara</title>
  <defs>
    <linearGradient id="lunara-maskable-gradient" x1="150" y1="140" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7BD8"/>
      <stop offset="0.55" stop-color="#A79AEC"/>
      <stop offset="1" stop-color="#8FB8F0"/>
    </linearGradient>
  </defs>

  <!--
    Maskable icon: the full bleed background is intentional, and the mark is
    scaled to ~60% of the canvas so it survives an aggressive circular or
    squircle mask without clipping.
  -->
  <rect width="512" height="512" fill="#F6F4FE"/>
  <circle cx="256" cy="256" r="150" fill="url(#lunara-maskable-gradient)" opacity="0.12"/>

  <circle
    cx="256"
    cy="256"
    r="106"
    fill="none"
    stroke="url(#lunara-maskable-gradient)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-dasharray="520 148"
    transform="rotate(-118 256 256)"
  />
  <circle cx="256" cy="256" r="34" fill="url(#lunara-maskable-gradient)"/>
  <circle cx="256" cy="141" r="17" fill="url(#lunara-maskable-gradient)" opacity="0.85"/>
</svg>
